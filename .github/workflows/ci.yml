name: SYJ-AEGIS CI

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write
  pages: write
  id-token: write

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -q
      - name: CI security scan
        run: >-
          aegis ci .
          --baseline .github/aegis-baseline.json
          --suppressions .github/aegis-suppressions.json
          --sarif .aegis/results.sarif
          --fail-on high
      - name: Upload SARIF
        if: always() && hashFiles('.aegis/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .aegis/results.sarif

  dashboard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install
        run: python -m pip install -e .
      - name: Generate scanner output
        run: aegis scan .

      - name: Rebuild dashboard from real scanner output
        run: python scripts/build_docs.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
